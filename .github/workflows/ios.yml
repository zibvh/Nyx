name: Build NYX iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-online
      - name: Add iOS platform
        run: npx cap add ios
      - name: Install NYX native iOS layer
        run: node scripts_setup_ios.js
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Build iOS simulator app (no signing required)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app nyx-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nyx-ios-simulator
          path: nyx-ios-simulator.zip
