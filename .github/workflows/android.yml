name: Build NYX Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Node dependencies
        run: npm install --no-audit --no-fund --prefer-online
      - run: npx cap add android
      - run: node scripts_patch_android.js

      - name: Set Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          import re
          code=int(__import__('os').environ.get('GITHUB_RUN_NUMBER','1'))
          s=re.sub(r'versionCode\\s+\\d+', f'versionCode {code}', s, count=1)
          s=re.sub(r'versionName\\s+"[^"]+"', f'versionName "0.9.{code}"', s, count=1)
          p.write_text(s)
          PY

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nyx-debug-apk-v48-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
