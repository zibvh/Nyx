name: Build NYX Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Node dependencies
        run: npm install --no-audit --no-fund --prefer-online
      - name: Create release keystore from GitHub Secret
        env:
          NYX_KEYSTORE_BASE64: ${{ secrets.NYX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NYX_KEYSTORE_BASE64" ]; then echo "NYX_KEYSTORE_BASE64 is not configured"; exit 1; fi
          echo "$NYX_KEYSTORE_BASE64" | base64 --decode > nyx-release.jks
          test -s nyx-release.jks

      - run: npx cap add android
      - name: Move release keystore into Android project
        run: mv nyx-release.jks android/nyx-release.jks
      - run: node scripts_patch_android.js

      - name: Set Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('android/app/build.gradle')
          s=p.read_text()
          code=int(os.environ.get('GITHUB_RUN_NUMBER','1'))
          s=re.sub(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "0.9.{code}"', s, count=1)
          p.write_text(s)
          PY

      - run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          NYX_KEYSTORE_PASSWORD: ${{ secrets.NYX_KEYSTORE_PASSWORD }}
          NYX_KEY_ALIAS: ${{ secrets.NYX_KEY_ALIAS }}
          NYX_KEY_PASSWORD: ${{ secrets.NYX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: nyx-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
